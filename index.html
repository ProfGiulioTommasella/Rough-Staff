<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rough Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap">
  <link rel="stylesheet" href="src/css/style.css?v=9">
</head>
<body>

<!-- Overlay "ruota il telefono" (portrait su mobile) -->
<div id="rotate-overlay" hidden>
  <div id="rotate-box">
    <div id="rotate-icon">&#8635;</div>
    <p>Ruota il telefono</p>
  </div>
</div>

<!-- Wrapper scalabile: tutto il palco 1280×768 vive qui dentro -->
<div id="stage-wrapper">

<!-- ── HOME ── -->
<div id="home-screen">
  <img id="home-bg" src="schermata_home.png" alt="">

  <div class="home-controls">
    <img id="home-title" src="home-horizontal-titleoff.png" alt="">

    <img id="btn-players-1" src="btn-giocatori-normal1.png" alt="1">
    <img id="btn-players-2" src="btn-giocatori-normal2.png" alt="2">
    <img id="btn-players-3" src="btn-giocatori-normal3.png" alt="3">
    <img id="btn-players-4" src="btn-giocatori-normal4.png" alt="4">

    <img id="btn-lang"  src="btn-home-horizontal-language-it.png" alt="Lingua">
    <img id="btn-timer" src="btn-home-horizontal-timer-off.png"   alt="Timer" hidden>

    <img id="btn-start" src="btn-home-horizontal-startoff.png" alt="Start" hidden>

    <img id="btn-diff-spazi"     src="btn-difficolta-spazi-normal.png"     alt="Spazi">
    <img id="btn-diff-righi"     src="btn-difficolta-righi-normal.png"     alt="Righi">
    <img id="btn-diff-penta1"    src="btn-difficolta-penta1-normal.png"    alt="Penta 1">
    <img id="btn-diff-pentafull" src="btn-difficolta-pentafull-normal.png" alt="Penta Full">
  </div>
</div>

<!-- ── TRANSIZIONE ── -->
<div id="transition-overlay" hidden>
  <img id="transition-img" src="porta-transizione1.png" alt="">
</div>

<!-- ── GAME ── -->
<div id="game-screen" hidden>
  <img id="game-bg" src="schermata_game.png" alt="">

  <div class="game-ui">

    <!-- Round (testo) -->
    <div id="round-display">1 / 5</div>

    <!-- Titolo decorativo gioco (nascosto durante il game, visibile solo in HOME) -->
    <img id="game-title" src="home-horizontal-titleon.png" alt="" hidden>

    <!-- Pentagramma (div CSS + canvas) -->
    <div id="staff-area">
      <canvas id="staff-canvas" width="800" height="400"></canvas>
    </div>

    <!-- Note creator e spot cover (overlay full-stage) -->
    <img id="note-creator" src="note_creator.png"    alt="" hidden>
    <img id="spot-cover"   src="spot_cover_notes.png" alt="" hidden>

    <!-- Pulsanti azione -->
    <img id="btn-go"     src="btn-go.png"     alt="GO!">
    <img id="btn-reveal" src="btn-reveal.png" alt="Reveal" hidden>
    <img id="btn-home"   src="btn-home.png"   alt="Home">

    <!-- Giocatore 1 -->
    <div id="player-controls-1" class="player-controls">
      <img class="player-badge" src="badge-giocatore1.png" alt="P1">
      <img id="score-1"      class="score-img"  src="pl1-score-0.png"             alt="">
      <img id="score-anim-1" class="score-anim" src="animazione-punteggio-pl1.png" alt="" hidden>
      <img id="answer-bar-1" class="answer-bar" src="barra_risposta_it_q_pl1.png" alt="" hidden>
      <img id="btn-plus-1"   class="btn-plus"   src="btn-plus-pl1.png"             alt="+">
      <img id="btn-minus-1"  class="btn-minus"  src="btn-minus-pl1.png"            alt="-">
      <img id="winner-icon-1" class="winner-icon" src="winner_icon.png" alt="" hidden>
    </div>

    <!-- Giocatore 2 -->
    <div id="player-controls-2" class="player-controls">
      <img class="player-badge" src="badge-giocatore2.png" alt="P2">
      <img id="score-2"      class="score-img"  src="pl2-score-0.png"             alt="">
      <img id="score-anim-2" class="score-anim" src="animazione-punteggio-pl2.png" alt="" hidden>
      <img id="answer-bar-2" class="answer-bar" src="barra_risposta_it_q_pl2.png" alt="" hidden>
      <img id="btn-plus-2"   class="btn-plus"   src="btn-plus-pl2.png"             alt="+">
      <img id="btn-minus-2"  class="btn-minus"  src="btn-minus-pl2.png"            alt="-">
      <img id="winner-icon-2" class="winner-icon" src="winner_icon.png" alt="" hidden>
    </div>

    <!-- Giocatore 3 -->
    <div id="player-controls-3" class="player-controls">
      <img class="player-badge" src="badge-giocatore3.png" alt="P3">
      <img id="score-3"      class="score-img"  src="pl3-score-0.png"             alt="">
      <img id="score-anim-3" class="score-anim" src="animazione-punteggio-pl3.png" alt="" hidden>
      <img id="answer-bar-3" class="answer-bar" src="barra_risposta_it_q_pl3.png" alt="" hidden>
      <img id="btn-plus-3"   class="btn-plus"   src="btn-plus-pl3.png"             alt="+">
      <img id="btn-minus-3"  class="btn-minus"  src="btn-minus-pl3.png"            alt="-">
      <img id="winner-icon-3" class="winner-icon" src="winner_icon.png" alt="" hidden>
    </div>

    <!-- Giocatore 4 -->
    <div id="player-controls-4" class="player-controls">
      <img class="player-badge" src="badge-giocatore4.png" alt="P4">
      <img id="score-4"      class="score-img"  src="pl4-score-0.png"             alt="">
      <img id="score-anim-4" class="score-anim" src="animazione-punteggio-pl4.png" alt="" hidden>
      <img id="answer-bar-4" class="answer-bar" src="barra_risposta_it_q_pl4.png" alt="" hidden>
      <img id="btn-plus-4"   class="btn-plus"   src="btn-plus-pl4.png"             alt="+">
      <img id="btn-minus-4"  class="btn-minus"  src="btn-minus-pl4.png"            alt="-">
      <img id="winner-icon-4" class="winner-icon" src="winner_icon.png" alt="" hidden>
    </div>

  </div>
</div>

</div><!-- /stage-wrapper -->

<script>
  // Scaling e mobile detection (non-module, eseguito subito)
  (function () {
    const STAGE_W = 1280, STAGE_H = 768;
    // Schermo "piccolo" = telefono (dimensione minore < 600px CSS)
    const MOBILE = Math.min(screen.width, screen.height) < 600;
    if (MOBILE) document.documentElement.classList.add('mobile-2p');

    function fitStage() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const portrait = vw < vh;
      const rotateEl = document.getElementById('rotate-overlay');
      const wrapEl   = document.getElementById('stage-wrapper');
      if (MOBILE && portrait) {
        rotateEl.hidden = false;
        wrapEl.style.visibility = 'hidden';
        return;
      }
      rotateEl.hidden = true;
      wrapEl.style.visibility = '';
      const scale = Math.min(vw / STAGE_W, vh / STAGE_H, 1);
      wrapEl.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
    document.addEventListener('DOMContentLoaded', fitStage);
  })();
</script>

<script type="module">
  import { initHome } from './src/js/home.js?v=9';
  import { startGame } from './src/js/game.js?v=9';

  function onStart(state) {
    startGame(state, () => initHome(onStart));
  }

  initHome(onStart);
</script>
</body>
</html>
